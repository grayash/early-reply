<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>관리 · 먼저 온 답장</title>
<meta name="description" content="관리자용">
<meta property="og:type" content="website">
<meta property="og:site_name" content="먼저 온 답장">
<meta property="og:title" content="관리 · 먼저 온 답장">
<meta property="og:description" content="관리자용">
<meta property="og:image" content="/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f4efe6">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="wrap">
  <h1>관리</h1>
  <p class="lead">관리자만 쓰는 화면이에요. 주소를 다른 사람에게 알리지 마세요.</p>
  <label for="key" class="hint">관리자 열쇠 (Cloudflare에 넣어 둔 ADMIN_KEY)</label>
  <input id="key" type="password" autocomplete="off" class="field">

  <h2>받은 의견</h2>
  <div class="row"><button class="btn line" id="fbLoad">불러오기</button></div>
  <div id="fbList"></div>

  <h2>신고된 글</h2>
  <p class="hint">서로 다른 3명이 신고하면 자동으로 가려져요. 잘못 가려졌으면 되살리고, 문제가 있으면 지워요.</p>
  <div class="row"><button class="btn line" id="rpLoad">불러오기</button></div>
  <div id="rpList"></div>

  <h2>글 찾아 지우기</h2>
  <p class="hint">기기를 바꿔 직접 지울 수 없는 사람이 의견으로 글 주소를 보내오면 여기서 지워요.</p>
  <input id="pid" class="field" placeholder="글 주소 또는 id" autocomplete="off">
  <div class="row"><button class="btn line" id="pFind">찾기</button></div>
  <div id="pOne"></div>

  <h2>의미 검색 준비</h2>
  <p class="hint">문장이 바뀌어 다시 배포할 때마다 한 번 눌러 주세요. 문장들의 의미값을 계산해 저장해요. 1~2분 걸려요.</p>
  <div class="row"><button class="btn" id="go">계산 시작</button><button class="btn line" id="chk">상태 확인</button></div>
  <p id="log" class="hint" aria-live="polite"></p>
</main>
<script type="module">
import { api, $, chrome, esc } from '/js/common.js';
chrome('');
const key = () => $('#key').value.trim();
const log = (s) => { $('#log').textContent = s; };
const call = (body) => api('admin/manage', { method: 'POST', body: { key: key(), ...body } });
const when = (ms) => new Date(ms).toLocaleString('ko-KR');
const postRow = (p) => `<article class="post" data-id="${esc(p.id)}">
  <header><span>${when(p.at)}</span><span>· 신고 ${p.reports || 0}</span>${p.hidden ? '<span class="badge">가려짐</span>' : ''}</header>
  <p class="text">${esc(p.text)}</p>
  <p class="hint">답글: ${esc(p.quote?.author?.name || '')} · ${esc((p.quote?.ko || '').slice(0, 40))}</p>
  <footer><a href="/post.html?id=${encodeURIComponent(p.id)}" target="_blank" rel="noopener">글 보기</a><span class="sp"></span>
    ${p.hidden ? '<button data-a="restore">되살리기</button>' : '<button data-a="hide">가리기</button>'}<button data-a="delete">지우기</button></footer></article>`;
async function act(e) {
  const btn = e.target.closest('button[data-a]'); if (!btn) return;
  const card = btn.closest('[data-id]'); const a = btn.dataset.a;
  if (a === 'delete' && btn.dataset.sure !== '1') { btn.dataset.sure = '1'; btn.textContent = '정말 지우기'; return; }
  const r = await call({ act: a, id: card.dataset.id });
  if (r.error) return alertMsg(card, r.error);
  card.outerHTML = `<p class="hint">${{ restore: '되살렸어요.', hide: '가렸어요.', delete: '지웠어요.' }[a]}</p>`;
}
const alertMsg = (el, m) => el.insertAdjacentHTML('beforeend', `<p class="err">${esc(m)}</p>`);
for (const id of ['#rpList', '#pOne']) $(id).addEventListener('click', act);

$('#fbLoad').onclick = async () => {
  const r = await call({ act: 'feedback' });
  $('#fbList').innerHTML = r.error ? `<p class="err">${esc(r.error)}</p>` : r.feedback.length
    ? r.feedback.map((f) => `<div class="box" data-fb="${f.id}"><p class="hint">${when(f.created_at)}</p><p style="white-space:pre-wrap;margin:6px 0">${esc(f.text)}</p><button class="btn line" data-done="${f.id}">확인했어요 (지우기)</button></div>`).join('')
    : '<p class="hint">받은 의견이 없어요.</p>';
};
$('#fbList').addEventListener('click', async (e) => {
  const id = e.target.dataset?.done; if (!id) return;
  const r = await call({ act: 'feedback-done', id }); if (!r.error) e.target.closest('[data-fb]').remove();
});
$('#rpLoad').onclick = async () => {
  const r = await call({ act: 'reported' });
  $('#rpList').innerHTML = r.error ? `<p class="err">${esc(r.error)}</p>` : r.posts.length ? r.posts.map(postRow).join('') : '<p class="hint">신고된 글이 없어요.</p>';
};
$('#pFind').onclick = async () => {
  const r = await call({ act: 'find', id: $('#pid').value });
  $('#pOne').innerHTML = r.error ? `<p class="err">${esc(r.error)}</p>` : postRow(r.post);
};
$('#chk').onclick = async () => { const r = await api('admin/embed', { method: 'POST', body: { key: key(), check: true } }); log(r.error || (r.ready ? `준비 완료 · 문장 ${r.total}개` : `아직 준비되지 않았어요 · 문장 ${r.total}개`)); };
$('#go').onclick = async () => {
  let chunk = 0;
  for (;;) {
    const r = await api('admin/embed', { method: 'POST', body: { key: key(), chunk } });
    if (r.error) return log('멈췄어요: ' + r.error);
    log(`${r.saved ?? r.total} / ${r.total}`);
    if (r.done) return log(`끝났어요 · 문장 ${r.total}개`);
    chunk = r.next;
  }
};
</script>
</body>
</html>
